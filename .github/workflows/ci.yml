name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests · python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (no runtime deps; pytest is the only test tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Environment check
        run: aikb doctor
      - name: Tests
        run: python -m pytest -q
      - name: CLI end to end
        run: |
          python tests/test_smoke.py
          aikb --version
